<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大学生日程助手</title>
  <!-- 相对路径引用：GitHub Pages 子路径部署也能正常加载（TECH_DESIGN §8.2）
       ?v= 是「缓存版本号」：改了 css/js 就把这个日期改成当天，浏览器会当成新文件重新下载。
       不加的话浏览器可能拿旧 js 配新 js（会出现 Rules.isMonday is not a function 这类怪错）。 -->
  <link rel="stylesheet" href="./css/style.css?v=20260923j">
</head>
<body>
  <!-- 顶部提示条：错误 / 提示的统一出口 -->
  <div id="banner" class="banner" hidden></div>

  <!-- 顶栏：标题 + 当前周次 + 视图切换 + 学期设置（手机端标签栏自动落到底部） -->
  <header class="topbar">
    <h1 class="topbar__title">大学生日程助手<span id="term-label" class="topbar__week is-empty"></span></h1>
    <div class="topbar__actions">
      <nav class="tabs">
        <button class="tab is-active" data-view="week" type="button">周视图</button>
        <button class="tab" data-view="today" type="button">今日视图</button>
      </nav>
      <button class="btn btn--ghost" type="button" data-action="open-settings">学期设置</button>
      <button class="btn btn--ghost" type="button" data-action="open-export">导出 / 备份</button>
    </div>
  </header>

  <!-- 导入 JSON 的隐藏文件选择框（点「导入 JSON 数据」时触发） -->
  <input type="file" id="import-file" accept=".json,application/json" hidden>

  <!-- 视图容器：加载骨架屏 / 初始设定 / 周视图 / 今日视图，按页面状态切换 -->
  <main class="main">
    <div id="app-skeleton" class="skeleton" hidden></div>
    <section id="view-setup" class="view" hidden></section>
    <section id="view-week" class="view"></section>
    <section id="view-today" class="view" hidden></section>
  </main>

  <!-- 弹窗骨架：表单与冲突提示的容器（第③步起填充内容） -->
  <div id="modal-mask" class="mask" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- 自建日期 / 时间选择面板（替代原生 date/time 控件：原生浮层加不了 ×，触屏易误触）
       内容由 views.js 的 pickerSheetHtml() 画，这里只放骨架 -->
  <div id="picker-mask" class="picker" hidden>
    <div id="picker-sheet" class="picker__sheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast" hidden></div>

  <!-- 脚本加载顺序 = 依赖顺序；不使用 ES Module（TECH_DESIGN §1.3）
       ?v= 同上：改动任一文件后统一把日期改掉，避免新旧混载 -->
  <script src="./js/store.js?v=20260923j"></script>
  <script src="./js/rules.js?v=20260923j"></script>
  <script src="./js/ics.js?v=20260923j"></script>
  <script src="./js/mock.js?v=20260923j"></script>
  <script src="./js/views.js?v=20260923j"></script>
  <script src="./js/app.js?v=20260923j"></script>
</body>
</html>
