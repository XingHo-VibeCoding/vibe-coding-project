<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大学生日程助手 · mock 版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6fa; color: #1f2937;
      min-height: 100vh; display: flex; justify-content: center;
      padding: 40px 16px;
    }
    .wrap { width: 100%; max-width: 480px; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #6b7280; margin-bottom: 24px; }
    .card {
      background: #fff; border-radius: 12px; padding: 16px;
      margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .card h2 { font-size: 14px; margin-bottom: 10px; color: #374151; }
    .status { font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #d1d5db; flex: none; }
    .dot.ok { background: #22c55e; }
    .dot.bad { background: #ef4444; }
    code { font-family: Consolas, monospace; background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .api { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e5e7eb; font-size: 13px; }
    .api:last-child { border-bottom: none; }
    .api .m { color: #6b7280; width: 44px; flex: none; font-size: 12px; font-weight: 600; }
    .api .todo { color: #9ca3af; font-size: 12px; }
    .foot { text-align: center; font-size: 11px; color: #9ca3af; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>大学生日程助手 · mock 版</h1>
    <p class="sub">Day 15 部署练习页 —— 前后端各占一半，今天只搭骨架</p>

    <div class="card">
      <h2>后端服务状态</h2>
      <p class="status" id="status"><span class="dot" id="dot"></span><span id="msg">正在检测 /api/health …</span></p>
    </div>

    <div class="card">
      <h2>接口清单（占位，见 api-contract.md）</h2>
      <div class="api"><span><span class="m">GET</span> <code>/api/health</code></span><span class="todo">已上线</span></div>
      <div class="api"><span><span class="m">GET</span> <code>/api/list</code></span><span class="todo">Day 16+ 再实现</span></div>
      <div class="api"><span><span class="m">POST</span> <code>/api/favorite</code></span><span class="todo">Day 16+ 再实现</span></div>
      <div class="api"><span><span class="m">PUT</span> <code>/api/update</code></span><span class="todo">Day 16+ 再实现</span></div>
      <div class="api"><span><span class="m">DELETE</span> <code>/api/delete</code></span><span class="todo">Day 16+ 再实现</span></div>
    </div>

    <p class="foot">静态托管 · 前端 mock 版 · 数据暂为假，接口暂为空</p>
  </div>

  <script>
    // 页面打开后自动请求一次 /api/health，把后端状态显示在卡片上。
    // 地址写的是 HTTP 网关的完整公网地址（静态托管和网关是两个域名）。
    var HEALTH_URL = 'https://vibecoding-test-d5fqmhbb955e19dd-1499011319.ap-shanghai.app.tcloudbase.com/api/health'
    fetch(HEALTH_URL)
      .then(function (r) { return r.json() })
      .then(function (d) {
        document.getElementById('dot').className = 'dot ok'
        document.getElementById('msg').textContent = '后端连通，返回：' + JSON.stringify(d)
      })
      .catch(function () {
        document.getElementById('dot').className = 'dot bad'
        document.getElementById('msg').textContent = '后端暂不可达（跨域或未部署，见 api-contract.md）'
      })
  </script>
</body>
</html>
